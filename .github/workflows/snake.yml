name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * 0" # Runs once a week (Sunday at 00:00 UTC)
  workflow_dispatch: # Keeps the button to run it manually if you want

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark
            
      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-snake*.svg
          git commit -m "chore: update snake graph" || exit 0
          git push
